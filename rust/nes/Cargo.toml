[package]
name = "nes"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "nes"
#crate-type = ["cdylib"]

[dependencies]
python_gui = { path = "../python_gui" }
sdl2 = "0.37"
bitflags = "1"
imgui = { workspace = true, features = ["docking", "tables-api"] }
imgui-sys = { workspace = true, features = ["docking"] }
pyo3.workspace = true
anyhow = { version = "1.0", features = ["backtrace"] }
thiserror = "2.0.9"
serde = { version = "1.0.217", features = ["derive"] }
indexmap = { version = "2.7.0", features = ["serde"] }
log = "0.4.22"
serde_annotate = { git = "https://github.com/lowRISC/serde-annotate" }
rand = "0.8.5"
#pyo3-log = "0.12.1"
serde_json = "1.0.134"
typetag = "0.2.20"
#rfd = {version = "0.15.2", features = ["gtk3"],  default-features = false }
#directories = "6.0.0"
sha2 = "0.10.8"
hex = "0.4.3"
parking_lot = { version = "0.12.4", features = ["serde", "deadlock_detection"] }
#chrono = "0.4.39"
#whoami = "1.5.2"
#shellwords = "1.1.0"
#itertools = "0.14.0"
#pathdiff = "0.2.3"

[build-dependencies]
cc = "1.0"
