[package]
name = "python_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "1"
pyo3.workspace = true
imgui-sys = {workspace = true, features=["docking"]}
imgui = { workspace = true, features = ["docking", "tables-api"] }
imgui-sdl2-support = { version = "0.13.0", git="https://github.com/imgui-rs/imgui-sdl2-support", rev="0a918d3d0c70b873503afa03c8977d725a7145f4" }
imgui-glow-renderer = { version = "0.13.0" }
anyhow = { version = "1.0", features = ["backtrace"] }
directories = "6.0.0"
glow = "0"
image = "0.23"
sdl2 = "0.37"
winit = { version = "0.29.3" }
send_wrapper = "0.6.0"
zerocopy = { version = "0.8.14", features = ["derive"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
indexmap = { version = "2.7.0", features = ["serde"] }
log = "0.4.22"

[build-dependencies]
cc = "1.0"
pkg-config = "0.3.32"
